[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p72-alpha-gateway"
version = "1.0.0"
description = "P72 Alpha Gateway — Secure LLM access for traders & quants"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "sqlalchemy>=2.0.0",
    "plotext>=5.2.8",
    "pypdf>=3.0.0",
]

[project.scripts]
p72-ai = "mly_ai.cli:main_entry"
mly-ai = "mly_ai.cli:main_entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["mly_ai*"]
